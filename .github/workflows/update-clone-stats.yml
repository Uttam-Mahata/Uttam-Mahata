name: Update Clone Stats

on:
  schedule:
    - cron: '0 0 * * *'   # runs daily at midnight UTC
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write

jobs:
  update-clone-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch top 5 cloned repos and update README
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OWNER: Uttam-Mahata
        run: |
          set -e

          # Fetch all repo names (up to 200)
          repos=$(gh repo list "$OWNER" --limit 200 --json name --jq '.[].name')

          tmpfile=$(mktemp)

          for repo in $repos; do
            result=$(gh api "repos/$OWNER/$repo/traffic/clones" \
              --jq '[.count, .uniques, "'"$repo"'"] | @tsv' 2>/dev/null || echo "0	0	$repo")
            echo "$result" >> "$tmpfile"
          done

          # Sort descending by clone count, deduplicate, take top 5
          top5=$(sort -rn "$tmpfile" | awk '!seen[$3]++' | head -5)

          # Build the markdown table
          table="| # | Repository | Clones (14d) | Unique Cloners |\n"
          table+="|---|-----------|:---:|:---:|\n"
          rank=1
          while IFS=$'\t' read -r count uniq repo; do
            table+="| $rank | [$repo](https://github.com/$OWNER/$repo) | **$count** | $uniq |\n"
            rank=$((rank + 1))
          done <<< "$top5"

          updated_at="<!-- updated: $(date -u '+%Y-%m-%d %H:%M UTC') -->"

          # Replace content between markers in README
          python3 - <<PYEOF
          import re, os

          with open('README.md', 'r') as f:
              content = f.read()

          new_block = """<!-- CLONE-STATS:START -->
          ## 📦 Most Cloned Repositories

          $table
          $updated_at
          <!-- CLONE-STATS:END -->"""

          # Collapse the heredoc indentation
          new_block = '\n'.join(line.lstrip() for line in new_block.splitlines())

          pattern = r'<!-- CLONE-STATS:START -->.*?<!-- CLONE-STATS:END -->'
          if re.search(pattern, content, re.DOTALL):
              content = re.sub(pattern, new_block, content, flags=re.DOTALL)
          else:
              content = content.rstrip() + '\n\n' + new_block + '\n'

          with open('README.md', 'w') as f:
              f.write(content)

          print("README updated successfully")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (
            git add README.md &&
            git commit -m "chore: update clone stats [skip ci]" &&
            git push
          )
